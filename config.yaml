## ======================== 常用配置 ======================== ##
# 这些配置在日常使用中经常需要调整

# Streamlit UI 界面语言 [zh-CN, en, zh-HK, ja, es, ru, fr]
display_language: "zh-CN"

# 翻译目标语言（写入 AI Prompt，可用自然语言描述，如 "English", "中文", "日本語"）
target_language: 'English'

# LLM 多线程访问数量（使用本地 LLM 时建议设为 1）
max_workers: 10


## ======================== ASR 语音识别 ======================== ##

whisper:
  # 模型选择 ["large-v3", "large-v3-turbo"]。注意：中文模型会强制使用 Belle/large-v3
  model: 'large-v3'

  # 识别语言（ISO 639-1 代码，如 'zh', 'en', 'ja'；设为 'auto' 时使用 detected_language）
  language: 'zh'

  # 运行模式 ["local", "cloud", "elevenlabs"]
  # - local: 本地运行（需要 GPU，>8GB 显存）
  # - cloud: 302.ai API（需要配置 WHISPERX_302_API_KEY）
  # - elevenlabs: ElevenLabs API（实验性，需要配置 ELEVENLABS_API_KEY）
  runtime: 'local'

  # ASR 自动检测到的语言（运行时由 ASR 后端自动更新，无需手动设置）
  detected_language: 'en'

# 转录前是否使用 Demucs 进行人声分离（推荐用于背景噪音较大的视频）
demucs: true


## ======================== 字幕与视频 ======================== ##

# 是否将字幕烧录到视频中（会增加处理时间）
burn_subtitles: true


## ======================== TTS 配音设置 ======================== ##
# 根据选择的 tts_method，配置对应部分的环境变量

# TTS 方法选择
# - sf_fish_tts: SiliconFlow FishTTS（需要 SF_FISH_TTS_API_KEY）
# - openai_tts: OpenAI TTS-1（302.ai，需要 OPENAI_TTS_API_KEY）
# - azure_tts: Azure TTS（302.ai，需要 AZURE_TTS_API_KEY）
# - fish_tts: FishTTS（302.ai，需要 FISH_TTS_API_KEY）
# - edge_tts: Microsoft Edge TTS（免费）
# - gpt_sovits: GPT-SoVITS（本地）
# - custom_tts: 自定义 TTS
# - sf_cosyvoice2: SiliconFlow CosyVoice2（需要 SF_COSYVOICE2_API_KEY）
# - f5tts: F5TTS（302.ai，需要 F5TTS_302_API_KEY）
tts_method: 'azure_tts'

# --- SiliconFlow FishTTS ---
sf_fish_tts:
  mode: "preset"          # preset: 预设声音, custom: 参考音频, dynamic: 动态参考
  voice: 'anna'           # 仅用于 mode "preset"
  custom_name: ''         # 仅用于 mode "custom"，请勿手动设置
  voice_id: ''            # 仅用于 mode "custom"

# --- OpenAI TTS (302.ai) ---
openai_tts:
  voice: 'alloy'

# --- Azure TTS (302.ai) ---
azure_tts:
  voice: 'zh-CN-YunfengNeural'

# --- FishTTS (302.ai) ---
fish_tts:
  character: 'AD学姐'
  character_id_dict:
    'AD学姐': '7f92f8afb8ec43bf81429cc1c9199cb1'
    '丁真': '54a5170264694bfc8e9ad98df7bd89c3'

# --- SiliconFlow CosyVoice2 ---
sf_cosyvoice2: { }

# --- Edge TTS (免费) ---
edge_tts:
  voice: 'zh-CN-XiaoxiaoNeural'

# --- GPT-SoVITS (本地) ---
gpt_sovits:
  character: 'Huanyuv2'
  refer_mode: 3           # 1: 使用提供参考音频, 2: 使用视频首段, 3: 使用每段音频

# --- F5TTS (302.ai) ---
f5tts: { }


## ======================== 高级设置 ======================== ##
# 大多数情况下无需修改这些配置

subtitle:
  # 每行字幕的最大字符长度
  max_length: 75
  # 译文字幕比源字幕的长度倍数（影响字幕分割参考）
  target_multiplier: 1.2

# 音频速度范围（用于调整配音速度以匹配字幕时长）
speed_factor:
  min: 1                  # 最小速度
  accept: 1.2             # 可接受的最大速度
  max: 1.4                # 最大速度

# 音频合并配置
min_subtitle_duration: 2.5   # 最小字幕时长（秒），短于此值会被强制延长
min_trim_duration: 3.5       # 最小修剪时长（秒），短于此值的字幕不会被分割
tolerance: 1.5               # 容差（秒），允许向后一条字幕延长的时间

# 首次粗切的最大词数（18-22 之间，过低会切分过细，过高会使字幕难以对齐）
max_split_length: 20

# 摘要长度（使用本地 LLM 时建议设为 2000）
summary_length: 8000

# 是否在翻译中启用反思模式（在原文中反映翻译结果）
reflect_translate: false

# 提取术语后、翻译前是否暂停（允许手动调整 output/log/terminology.json）
pause_before_translate: false

# ffmpeg 使用 h264_nvenc GPU 加速（需确保 GPU 支持）
ffmpeg_gpu: true

# YouTube 视频下载设置
youtube:
  cookies_path: ''        # YouTube cookies 文件路径（用于访问受限制视频）
ytb_resolution: '1080'    # 默认下载分辨率 [360, 1080, best]


## ======================== 系统配置 ======================== ##
# 以下配置极少需要修改

# Whisper 模型缓存目录
model_dir: './_model_cache'

# 支持的视频格式
allowed_video_formats:
  - 'mp4'
  - 'mov'
  - 'avi'
  - 'mkv'
  - 'flv'
  - 'wmv'
  - 'webm'

# 支持的音频格式
allowed_audio_formats:
  - 'wav'
  - 'mp3'
  - 'flac'
  - 'm4a'

# Spacy 模型映射（语言代码 -> 模型名）
spacy_model_map:
  en: 'en_core_web_md'
  ru: 'ru_core_news_md'
  fr: 'fr_core_news_md'
  ja: 'ja_core_news_md'
  es: 'es_core_news_md'
  de: 'de_core_news_md'
  it: 'it_core_news_md'
  zh: 'zh_core_web_md'

# 使用空格分隔的语言（用于 NLP 分词）
language_split_with_space:
  - 'en'
  - 'es'
  - 'fr'
  - 'de'
  - 'it'
  - 'ru'

# 不使用空格分隔的语言（使用专用分词器）
language_split_without_space:
  - 'zh'
  - 'ja'

# 中文 NLP 停用词文件路径（用于 jieba 分割）
chinese_stopwords_file: 'files/chinese_stopwords.txt'
