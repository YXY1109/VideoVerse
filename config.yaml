# * 带 * 标记的为高级设置，不会在 Streamlit 页面显示，只能手动在 config.py 中修改
# 建议在 streamlit 页面中进行设置
# -------------------
# version: "3.0.0"
# author: "Huanshere"
# -------------------

## ======================== 基础设置 ======================== ##

display_language: "zh-CN"

# API 设置（敏感信息请通过 .env 文件配置，优先级高于此处）
api:
  key: ''  # 通过环境变量 OPENAI_API_KEY 配置
  base_url: 'https://api.openai.com/v1'  # 通过环境变量 OPENAI_API_BASE 配置
  model: 'gpt-4.1'
  llm_support_json: true
  # * LLM 输出最大 token 数，用于长文本翻译
  max_tokens: 16384
# * LLM 多线程访问数量，使用本地 LLM 时设为 1
max_workers: 4

# 语言设置，写入 prompt 中，可用自然语言描述
target_language: 'English'

# 转录前是否使用 Demucs 进行人声分离
demucs: true

whisper:
  # ["large-v3", "large-v3-turbo"]。注意：中文模型会强制使用 Belle/large-v3
  model: 'large-v3'
  # Whisper 指定识别语言，ISO 639-1 代码
  language: 'zh'
  detected_language: 'en'
  # Whisper 运行模式 ["local", "cloud", "elevenlabs"]。指定运行位置，cloud 使用 302.ai API
  runtime: 'local'
  # 302.ai API 密钥（通过环境变量 WHISPERX_302_API_KEY 配置）
  whisperX_302_api_key: ''
  # ElevenLabs API 密钥（通过环境变量 ELEVENLABS_API_KEY 配置）
  elevenlabs_api_key: ''

# 是否将字幕烧录到视频中
burn_subtitles: true

## ======================== 高级设置 ======================== ##
# * ffmpeg 使用 h264_nvenc GPU 加速，请确保 GPU 支持
ffmpeg_gpu: false

# * YouTube 设置
youtube:
  cookies_path: ''

# * 下载 YouTube 视频的默认分辨率 [360, 1080, best]
ytb_resolution: '1080'

subtitle:
  # * 每行字幕的最大字符长度
  max_length: 75
  # * 译文字幕比源字幕稍长，影响字幕分割的参考长度
  target_multiplier: 1.2

# * 摘要长度，使用本地 LLM 时建议设为 2000
summary_length: 8000

# * 首次粗切的最大词数，低于 18 会导致切分过细影响翻译，高于 22 则过长会使后续字幕分割难以对齐
max_split_length: 20

# * 是否在原文中反映翻译结果
reflect_translate: false

# * 提取专业术语后、翻译前是否暂停，允许用户手动调整术语表 output\log\terminology.json
pause_before_translate: false

## ======================== 配音设置 ======================== ##
# TTS 选择 [sf_fish_tts, openai_tts, gpt_sovits, azure_tts, fish_tts, edge_tts, custom_tts]
tts_method: 'azure_tts'

# SiliconFlow FishTTS
sf_fish_tts:
  # SiliconFlow API 密钥（通过环境变量 SF_FISH_TTS_API_KEY 配置）
  api_key: ''
  # 仅用于 mode "preset"
  voice: 'anna'
  # * 仅用于 mode "custom"，请勿手动设置
  custom_name: ''
  voice_id: ''
  # preset, custom, dynamic
  mode: "preset"

# OpenAI TTS-1 API 配置，仅支持 302.ai API
openai_tts:
  api_key: ''  # 通过环境变量 OPENAI_TTS_API_KEY 配置
  voice: 'alloy'

# Azure 配置，仅支持 302.ai API
azure_tts:
  api_key: ''  # 通过环境变量 AZURE_TTS_API_KEY 配置
  voice: 'zh-CN-YunfengNeural'

# FishTTS 配置，仅支持 302.ai API
fish_tts:
  api_key: ''  # 通过环境变量 FISH_TTS_API_KEY 配置
  character: 'AD学姐'
  character_id_dict:
    'AD学姐': '7f92f8afb8ec43bf81429cc1c9199cb1'
    '丁真': '54a5170264694bfc8e9ad98df7bd89c3'

# SiliconFlow CosyVoice2 克隆
sf_cosyvoice2:
  api_key: ''  # 通过环境变量 SF_COSYVOICE2_API_KEY 配置

# Edge TTS 配置
edge_tts:
  voice: 'zh-CN-XiaoxiaoNeural'

# SoVITS 配置
gpt_sovits:
  character: 'Huanyuv2'
  refer_mode: 3

f5tts:
  302_api: ''  # 通过环境变量 F5TTS_302_API_KEY 配置

# * 音频速度范围
speed_factor:
  min: 1
  accept: 1.2 # 可接受的最大速度
  max: 1.4

# * 音频合并配置
min_subtitle_duration: 2.5 # 最小字幕时长，会被强制延长
min_trim_duration: 3.5 # 短于此值的字幕不会被分割
tolerance: 1.5 # 允许向后一条字幕延长的时间




## ======================== 附加设置 ======================== ##

# Whisper 模型目录
model_dir: './_model_cache'

# 支持的上传视频格式
allowed_video_formats:
- 'mp4'
- 'mov'
- 'avi'
- 'mkv'
- 'flv'
- 'wmv'
- 'webm'

allowed_audio_formats:
- 'wav'
- 'mp3'
- 'flac'
- 'm4a'

# Spacy 模型
spacy_model_map:
  en: 'en_core_web_md'
  ru: 'ru_core_news_md'
  fr: 'fr_core_news_md'
  ja: 'ja_core_news_md'
  es: 'es_core_news_md'
  de: 'de_core_news_md'
  it: 'it_core_news_md'
  zh: 'zh_core_web_md'

# 使用空格作为分隔符的语言
language_split_with_space:
- 'en'
- 'es'
- 'fr'
- 'de'
- 'it'
- 'ru'

# 不使用空格作为分隔符的语言
language_split_without_space:
- 'zh'
- 'ja'
