[project]
name = "video_verse"
version = "2.0.0"
description = "Videoverse - AI-powered video translation and dubbing tool (Async)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "torchaudio==2.7.1",
    "demucs",
    "jieba>=0.42.1",
    "json-repair>=0.55.0",
    "librosa>=0.11.0",
    "loguru>=0.7.3",
    "openai>=2.15.0",
    "pandas>=2.3.3",
    "pydub>=0.25.1",
    "spacy>=3.8.11",
    "whisperx>=3.4.3",
    "openpyxl>=3.1.5",
    "huggingface-hub[hf-xet]>=0.36.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.11",
    "mypy>=1.13.0",
    "bandit>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
demucs = { path = "files/demucs-main", editable = true }

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu118"]
override-dependencies = [
    "torchaudio==2.7.1",
]

[tool.hatch.build.targets.wheel]
packages = ["common", "core", "configs", "examples", "scripts", "llm"]

[tool.hatch.build.targets.wheel.shared-data]
"configs" = "configs"

[tool.pyright]
include = ["common", "core", "configs", "examples", "scripts", "llm"]
exclude = ["**/__pycache__", "**/.venv", "**/node_modules"]
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

# Ruff 配置 - 替代 flake8, pylint, isort, black
[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle 错误：检查代码是否违反 PEP8 规范的错误级问题（比如缩进错误、行太长、语法格式错误）
    "W", # pycodestyle 警告：违反 PEP8 但不影响运行的问题（比如多余空格）
    "F", # Pyflakes：检查代码逻辑错误（比如未定义变量、导入未使用、死代码），Ruff 核心功能
    "I", # isort：自动整理 import 顺序（比如标准库 / 第三方库 / 本地库分开），团队协作必备
    #    "PL", # Pylint：深度检查（比如变量命名不规范、函数复杂度高、缺少文档字符串），补充 F/E/W 的不足
    "S", # flake8-bandit（安全）：检测代码中的安全风险（比如硬编码密码、SQL 注入、使用不安全的加密方式）
    "B", # flake8-bugbear：识别容易导致 bug 的代码写法（比如空 except 块、不合理的条件判断），提升代码健壮性
    #    "T10", # debugger 调试代码残留：检测未删除的调试代码（比如 print、pdb.set_trace ()），上线前必查
    #    "T20", # print 语句残留：专门检测多余的 print 语句（比 T10 更聚焦），生产环境建议开启
    "N", # pep8-naming：强制 PEP8 命名规则
    "UP", # pyupgrade：提示使用新版本 Python 的语法（比如 3.8+ 的海象运算符、移除过时写法）
    "A", # flake8-builtins：检测是否用内置函数名（比如 list、dict、str）作为变量名，避免隐藏 bug
]
ignore = [
    "S101", # 允许使用 assert
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 渐进式：先设为 false
check_untyped_defs = true
ignore_missing_imports = true   # 兼容性考虑

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]  # 跳过 assert 检测（如果允许 assert）
