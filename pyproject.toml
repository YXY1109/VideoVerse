[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "src"
version = "2.0.0"
description = "Videoverse - AI-powered video translation and dubbing tool (Async)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    # 核心
    "python-dotenv==1.2.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    # 异步 HTTP
    "httpx>=0.27.0",
    "openai>=1.55.3",
    # 异步缓存
    "aiocache>=0.12.0",
    # 异步任务
    "async-timeout>=4.0.0",
    # 原有依赖
    "av>=13.0.0",
    "librosa==0.10.2.post1",
    "pytorch-lightning==2.3.3",
    "lightning==2.3.3",
    "transformers==4.48.0",
    "moviepy==1.0.3",
    "numpy==1.26.4",
    "opencv-python==4.10.0.84",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pydub==0.25.1",
    "replicate==0.33.0",
    "resampy==0.4.3",
    "spacy==3.7.4",
    "yt-dlp==2025.12.8",
    "json-repair==0.54.3",
    "autocorrect-py==2.14.0",
    "ctranslate2==4.4.0",
    "edge-tts==7.2.7",
    "whisperx==3.2.0",
    "syllables==1.1.4",
    "pypinyin==0.55.0",
    "g2p-en==2.1.0",
    "xmltodict==1.0.2",
    "rich==14.2.0",
    "nvidia-ml-py>=12.535.133",
    "torch==2.1.2",
    "torchvision==0.16.2",
    "torchaudio==2.1.2",
    "demucs",
    "en-core-web-md",
    "jieba>=0.42.1",
    "loguru>=0.7.3",
    "hf-xet>=1.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
demucs = { path = "./files/demucs-main" }
en-core-web-md = { path = "./files/en_core_web_md-3.7.1-py3-none-any.whl" }

[tool.uv]
override-dependencies = [
    "av>=13.0.0",
    "tokenizers>=0.21,<0.22",
]

[tool.setuptools.packages.find]
exclude = ["files*", "output*"]

# ==================== 测试配置 ====================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--asyncio-mode=auto",
]
markers = [
    "asyncio: mark test as an async test",
    "slow: mark test as slow running",
    "integration: mark test as integration test",
    "unit: mark test as unit test",
    "skip_ci: skip test in CI environment",
    "skip_env_clean: skip environment variable cleaning for this test",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "coverage[toml]>=7.3.0",
]
