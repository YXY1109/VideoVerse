[project]
name = "videoverse"
version = "0.1.0"
description = "Videoverse - AI-powered video translation and dubbing tool"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "av>=13.0.0",
    "librosa==0.10.2.post1",
    "pytorch-lightning==2.3.3",
    "lightning==2.3.3",
    "transformers==4.48.0",
    "moviepy==1.0.3",
    "numpy==1.26.4",
    "openai==1.55.3",
    "opencv-python==4.10.0.84",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "pydub==0.25.1",
    "PyYAML==6.0.2",
    "replicate==0.33.0",
    "requests==2.32.3",
    "resampy==0.4.3",
    "spacy==3.7.4",
    "streamlit==1.52.2",
    "yt-dlp==2025.12.8",
    "json-repair==0.54.3",
    "ruamel.yaml==0.18.17",
    "InquirerPy==0.3.4",
    "autocorrect-py==2.14.0",
    "ctranslate2==4.4.0",
    "edge-tts==7.2.7",
    "whisperx==3.2.0",
    "syllables==1.1.4",
    "pypinyin==0.55.0",
    "g2p-en==2.1.0",
    "xmltodict==1.0.2",
    "rich==14.2.0",
    "nvidia-ml-py>=12.535.133",
    "torch==2.1.2",
    "torchvision==0.16.2",
    "torchaudio==2.1.2",
    "demucs",
    "en-core-web-md",
    "python-dotenv==1.2.1",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }
torchaudio = { index = "pytorch-cu118" }
demucs = { path = "./files/demucs-main" }
en-core-web-md = { path = "./files/en_core_web_md-3.7.1-py3-none-any.whl" }

[tool.uv]
override-dependencies = [
    "av>=13.0.0",
    "tokenizers>=0.21,<0.22",
]

[tool.setuptools.packages.find]
exclude = ["files*", "output*"]
