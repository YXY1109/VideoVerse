[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=core
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --asyncio-mode=auto

markers =
    unit: 单元测试
    integration: 集成测试
    slow: 需要模型或网络的慢速测试
    gpu: 需要 GPU 的测试
    llm: 需要 LLM API 的测试
    requires_download: 需要文件下载的测试

asyncio_mode = auto
